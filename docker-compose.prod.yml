# Production stack for office LAN deployment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reports}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reports} -d ${POSTGRES_DB:-reports}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reports}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reports}
      UPLOAD_DIR: /data/uploads
      APP_URL: ${APP_URL:?Set APP_URL to your LAN base URL}
      SINGLE_TENANT_MODE: ${SINGLE_TENANT_MODE:-true}
      TZ: ${TZ:-UTC}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
